function pick(i){let c=state.current,k=(c.tier==='soft'?SOFT:STRONG)[c.index].kind;if(k==='pick3'){if(state.selection.includes(i))state.selection=state.selection.filter(x=>x!==i);else if(state.selection.length<3)state.selection.push(i)}else state.selection=[i];save();render()}
function randomChoice(n){let c=state.current,entry=(c.tier==='soft'?SOFT:STRONG)[c.index],length=entry.items?.length||(entry.kind==='boxes'?3:6);let ids=Array.from({length},(_,i)=>i).sort(()=>Math.random()-.5).slice(0,n);state.drawn=ids;state.reveal=true;save();render()}
function acceptChallenge(){let c=state.current,entry=(c.tier==='soft'?SOFT:STRONG)[c.index],id=Date.now()+'-'+rand(999999);let chosen=state.selection||[];let desc=entry.detail||'';if(entry.items){let ids=chosen.length?chosen:state.drawn?.length?state.drawn:entry.items.map((_,i)=>i);desc=ids.map(i=>entry.items[i]).join('\n')}if(entry.kind==='dice')desc=['Beso de 10 segundos','Tres besos en el cuello','Beso sorpresa','Beso apasionado de 20 segundos','Abrazo y cinco besos','Beso con ojos vendados'][state.drawn[0]];if(entry.kind==='boxes')desc=['Masaje de cinco minutos','Baile romántico','Diez besos donde elijas'][state.drawn[0]];state.pending.push({id,name:entry.name,desc,tier:c.tier,notes:'',place:''});if(c.tier==='strong'){state.strongEver=true;state.strongUsed.push(c.index)}else state.softUsed.push(c.index);state.lives=Math.min(5,state.lives+c.gain);state.current=null;state.wrong=false;save();render()}
function pending(){let arr=state.pending.filter(x=>!state.completed.includes(x.id));return `<main class="panel"><div class="eyebrow">Nuestra lista secreta</div><h1>Retos pendientes 📜</h1><p>Se pueden cumplir en casa o en Villeta, sin fecha de vencimiento. Una copa puede acompañar el momento si ambos quieren, pero nunca es requisito para jugar.</p><div class="row"><span class="pill">${arr.length} pendientes</span><span class="pill">${state.completed.length} completados</span></div><details><summary>Ver retos completados (${state.completed.length})</summary>${state.pending.filter(x=>state.completed.includes(x.id)).map(x=>`<div class="challenge"><b>✅ ${esc(x.name)}</b><button onclick="toggleComplete('${x.id}')">Devolver a pendientes</button></div>`).join('')||'<p>Aún no hay retos completados.</p>'}</details>${arr.length?arr.map(x=>`<div class="challenge"><div class="row"><h3>❤️‍🔥 ${esc(x.name)}</h3><span class="pill">${x.tier==='soft'?'Suave':'Fuerte'}</span></div><p style="white-space:pre-line">${esc(x.desc)}</p><div class="row" style="margin-top:12px"><button onclick="toggleComplete('${x.id}')">Marcar completado ✓</button><button onclick="setPlace('${x.id}')">📍 ${esc(x.place||'Elegir lugar')}</button></div>${x.place?`<span class="tag">${esc(x.place)}</span>`:''}</div>`).join(''):'<div class="notice">Todavía no hay retos acumulados. Aparecerán cuando necesites recuperar corazones.</div>'}</main>`}
function toggleComplete(id){state.completed=state.completed.includes(id)?state.completed.filter(x=>x!==id):[...state.completed,id];save();render()}
function setPlace(id){let x=state.pending.find(x=>x.id===id);x.place=x.place===''?'Casa':x.place==='Casa'?'Villeta':'Casa';save();render()}
function about(){return `<main class="panel"><div class="eyebrow">Cómo se juega</div><h1>Las reglas del corazón ❤️</h1><p>Empiezas con cinco vidas. Cada respuesta incorrecta resta una vida y puedes volver a intentarlo. Las respuestas correctas te llevan al siguiente latido.</p><p>Si te quedas sin corazones, aparecerá una oportunidad para recuperarlos mediante un reto. Los retos aceptados se guardan en tu lista, y puedes cumplirlos en casa o en Villeta.</p><p>Los tragos son opcionales. El cariño, la confianza y las decisiones compartidas son lo más importante.</p><details><summary>Administrar partida</summary><div class="notice"><p class="muted">Puedes reiniciar todo el progreso, incluidas las vidas y los retos acumulados.</p><button onclick="resetGame()">Reiniciar desde cero</button></div></details></main>`}
function resetGame(){if(confirm('¿Seguro que quieres borrar el progreso y todos los retos guardados en este dispositivo?')){state=fresh();optionOrder={};save();view='game';render()}}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script></body></html>
